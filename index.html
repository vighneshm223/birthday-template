<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday 🎂</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #29202a;
      overflow-x: hidden;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      padding: 40px 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #ffd6e8, #e8d8ff);
      position: relative;
      overflow: hidden;
    }

    .hero-content {
      max-width: 700px;
      position: relative;
      z-index: 2;
    }

    .small-text {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 58px;
      margin-bottom: 20px;
      line-height: 1.1;
    }

    .hero h1 span {
      color: #e94f91;
    }

    .hero p {
      font-size: 20px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #29202a;
      color: white;
      padding: 15px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      transform: translateY(-3px);
      background: #e94f91;
    }

    /* FLOATING HEARTS */
    .heart {
      position: absolute;
      font-size: 25px;
      animation: float 6s infinite ease-in-out;
      opacity: 0.7;
    }

    .heart:nth-child(1) {
      left: 10%;
      top: 20%;
    }

    .heart:nth-child(2) {
      right: 12%;
      top: 25%;
      animation-delay: 1s;
    }

    .heart:nth-child(3) {
      left: 20%;
      bottom: 15%;
      animation-delay: 2s;
    }

    .heart:nth-child(4) {
      right: 20%;
      bottom: 20%;
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-25px);
      }
    }

    /* SECTIONS */
    section {
      padding: 80px 25px;
      max-width: 1000px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 40px;
    }

    /* MESSAGE */
    .message {
      text-align: center;
      max-width: 700px;
    }

    .message p {
      font-size: 19px;
      line-height: 1.8;
    }

    /* MEMORIES */
    .memories {
      background: #fff;
      max-width: none;
    }

    .memory-container {
      max-width: 1000px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #fff7fb;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .photo {
      height: 220px;
      border-radius: 15px;
      background: linear-gradient(135deg, #ffd1e3, #dcd0ff);
      display: flex;
      align-items: center;
      justify-content
